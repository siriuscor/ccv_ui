<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Manmori Splash</title>
    <style>
        @font-face {
            font-family: 'PingFang SC';
            src: local('PingFang SC');
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-image: url('splash.png');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'PingFang SC', sans-serif;
            -webkit-app-region: drag;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 40px;
            border: 6px solid #000;
            box-shadow: 15px 15px 0 #000;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .icon {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            /* border: 4px solid #000; */
        }

        h1 {
            margin: 0;
            font-size: 48px;
            font-weight: 900;
            /* text-transform: uppercase; */
            letter-spacing: -2px;
            font-style: italic;
            color: #000;
        }

        .loading-dots {
            margin-top: 15px;
            font-size: 24px;
            font-weight: bold;
        }

        .dots::after {
            content: '';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% {
                content: '';
            }

            33% {
                content: '.';
            }

            66% {
                content: '..';
            }

            100% {
                content: '...';
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <img src="icon.png" class="icon" />
        <h1>Manmori</h1>
        <h2>守りたい、君の物語</h2>
        <div class="loading-dots">
            加载中<span class="dots"></span>
        </div>
    </div>
</body>

</html>
